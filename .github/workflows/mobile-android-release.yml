name: Mobile Android Release

# Builds the Code UI Android APK and publishes it as a GitHub Release.
#
# Versioning follows Orca Mobile: mobile/app.json is the single source of truth
# (expo.version = marketing version, android.versionCode = monotonic build id).
# Bump both, commit, then push a tag `mobile-android-v<version>` that matches
# the committed version. scripts/prepare-android-release.mjs refuses a tag that
# disagrees with app.json so a release can never carry the wrong version.
#
# The installed app polls the Releases API for the newest mobile-android-v* tag
# and offers the APK asset in-app (mobile/src/app-update). The asset name ends
# in `-<versionCode>.apk` so same-version rebuilds still compare correctly.
on:
  push:
    tags:
      - 'mobile-android-v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional exact version assertion, e.g. 0.2.0 (must match mobile/app.json)'
        required: false
        type: string
      publish_github_release:
        description: 'Create or update the mobile-android-v<version> GitHub Release'
        required: false
        default: true
        type: boolean

concurrency:
  # One group PER TAG, never cancelled: every tag builds on its own and none
  # is dropped. A shared group was tried on 2026-09-13 and, even with
  # cancel-in-progress off, GitHub keeps only ONE pending run per group, so
  # pushing 0.5.50 while 0.5.48 built silently cancelled the queued 0.5.49 and
  # left a tag with no release. (The 0.5.41/0.5.42 cancellations that morning
  # were a GitHub Actions incident, not a pile-up; parallel tag builds are
  # fine.)
  group: mobile-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Why: `gh release create` with the default GITHUB_TOKEN needs contents:write.
    permissions:
      contents: write

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Why pinned here: the action runs from the repo root, which has no
          # package.json "packageManager" field to read the version from.
          version: 11.25.0
          run_install: false

      - name: Install dependencies
        # postinstall builds the terminal + mermaid WebView engines.
        run: pnpm install --frozen-lockfile

      - name: Resolve release version and version code
        id: release
        env:
          MOBILE_ANDROID_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          MOBILE_ANDROID_PUBLISH_RELEASE: ${{ github.event.inputs.publish_github_release }}
        run: node scripts/prepare-android-release.mjs

      - name: Lint and typecheck
        run: |
          pnpm lint
          pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/pnpm-lock.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Expo prebuild
        run: npx expo prebuild --platform android --no-install

      - name: Build Android release APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          set -euo pipefail
          src="$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)"
          name="code-ui-android-v${{ steps.release.outputs.version }}-${{ steps.release.outputs.android_version_code }}.apk"
          mkdir -p dist
          cp "$src" "dist/$name"
          echo "path=mobile/dist/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          sha256sum "dist/$name"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Ensure GitHub release tag
        if: steps.release.outputs.publish_release == 'true' && !startsWith(github.ref, 'refs/tags/mobile-android-v')
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists"
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

      - name: Write release notes
        id: notes
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          # Why commit subjects, not --generate-notes: the in-app update card
          # shows this body as bullets, and this repo lands most work as direct
          # commits, which GitHub's generated notes leave out.
          # The previous PUBLISHED release, not the previous tag: a tag whose
          # build failed has no release, and cutting the notes at it would
          # leave its commits in no release at all (2026-09-13).
          # Sorted by version with the prefix stripped: `sort -t v -k 3` left
          # the key empty and fell back to string order, which called v0.5.9
          # newer than v0.5.46 (2026-09-13).
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '.[].tagName' 2>/dev/null | grep '^mobile-android-v' | grep -vx "$tag" | sed 's/^mobile-android-v//' | sort -V -r | head -n 1 | sed 's/^/mobile-android-v/' || true)"
          if [ -z "$previous" ]; then
            previous="$(git tag --list 'mobile-android-v*' --sort=-v:refname | grep -vx "$tag" | head -n 1 || true)"
          fi
          range="${previous:+$previous..}HEAD"
          {
            echo "## What's changed"
            echo
            # Why drop "Release x.y.z": the version-bump commit is every
            # release's first line and says nothing the release title does not.
            git log --no-merges --pretty='- %s' "$range" | { grep -vE '^- (Code UI Android [0-9]|Release-script test|Release v?[0-9]+(\.[0-9]+)*$)' || true; } | head -n 40
            echo
            if [ -n "$previous" ]; then
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$tag"
            fi
          } > dist/release-notes.md
          cat dist/release-notes.md

      - name: Create GitHub Release
        if: steps.release.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          apk="dist/${{ steps.apk.outputs.name }}"
          # GitHub's API answered HTTP 500 to a create once (2026-09-13) and a
          # passed 30-minute build was thrown away; try a few times.
          # `|| return 1` on each call: `set -e` is off inside a function
          # used as an `if` condition, so a failed upload followed by a
          # successful edit would have counted as published.
          publish() {
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "$apk" || return 1
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file dist/release-notes.md || return 1
            else
              gh release create "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Code UI Android v${{ steps.release.outputs.version }}" \
                --notes-file dist/release-notes.md \
                "$apk" || return 1
            fi
          }
          for attempt in 1 2 3 4 5; do
            if publish; then
              exit 0
            fi
            echo "release attempt $attempt failed; retrying in $((attempt * 30))s"
            sleep $((attempt * 30))
          done
          exit 1
