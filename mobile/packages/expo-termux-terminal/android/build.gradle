apply plugin: 'com.android.library'

group = 'expo.modules.termuxterminal'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

buildscript {
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
}
project.android {
  compileSdkVersion safeExtGet("compileSdkVersion", 36)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
  }
}

android {
  namespace "expo.modules.termuxterminal"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Termux's emulator and view (GPLv3) are vendored under src/main/java/com/termux
  // from termux-app master, minus the PTY-bound TerminalSession and its JNI. The
  // JitPack v0.118.3 AAR is older than the view and lacks the sixel and top-row
  // APIs the view calls, so the two halves are vendored from one commit.
  implementation "androidx.annotation:annotation:1.9.0"
}
